<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atouop_control</title>
<meta name="description" content="Atouop 个人主页的控制台：管理全部 9 个工具的数据，所有修改即时同步到主页。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%2305070c'/%3E%3Ctext%20x='32'%20y='44'%20font-family='monospace'%20font-size='36'%20font-weight='700'%20fill='%233d7bff'%20text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #05070c;
    --bg-soft: #0a1122;
    --card: rgba(255, 255, 255, 0.03);
    --header-bg: rgba(5, 7, 12, 0.82);
    --line: rgba(120, 160, 255, 0.16);
    --line-strong: rgba(120, 160, 255, 0.35);
    --text: #eef3fb;
    --muted: #8b96ab;
    --accent: #3d7bff;
    --accent-soft: rgba(61, 123, 255, 0.14);
    --danger: #ef476f;
    --ok: #06d6a0;
    --star-rgb: 150, 195, 255;
    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  html.light {
    --bg: #f3f6fc;
    --bg-soft: #ffffff;
    --card: rgba(20, 45, 90, 0.035);
    --header-bg: rgba(243, 246, 252, 0.86);
    --line: rgba(20, 45, 90, 0.14);
    --line-strong: rgba(20, 45, 90, 0.28);
    --text: #0b1526;
    --muted: #5a6a85;
    --accent: #2f6bff;
    --accent-soft: rgba(47, 107, 255, 0.1);
    --danger: #e0325c;
    --ok: #05a87f;
    --star-rgb: 70, 110, 190;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }
  canvas#stars {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

  /* 顶栏 */
  header.top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header.top .logo {
    font-family: var(--mono); font-weight: 700; font-size: 1rem;
    color: var(--text); letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  header.top .logo b { color: var(--accent); }
  header.top .sp { flex: 1; }
  .link {
    color: var(--muted); text-decoration: none; font-size: 0.85rem;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
    transition: all 0.2s;
  }
  .link:hover { color: var(--text); border-color: var(--line-strong); background: var(--accent-soft); }

  /* 标题区 */
  .hero { padding: 34px 4px 8px; }
  .hero h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.02em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  /* 概览统计 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 12px; margin: 22px 0 30px; }
  .stat {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); padding: 14px 16px;
  }
  .stat b { display: block; font-family: var(--mono); font-size: 1.35rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat span { font-size: 0.76rem; color: var(--muted); }

  /* 模块卡片 */
  .mod {
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); padding: 20px 20px 22px;
    margin-bottom: 20px;
  }
  .mod h2 {
    font-size: 1.02rem; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .mod h2 .no {
    font-family: var(--mono); font-size: 0.72rem; color: var(--accent);
    border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 2px 8px;
  }
  .mod h2 .sp { flex: 1; }
  .empty-tip { color: var(--muted); font-size: 0.85rem; padding: 8px 2px; }
  .badge { font-size: 0.74rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
  .badge.on { color: var(--ok); border-color: rgba(6, 214, 160, 0.5); }

  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .input {
    flex: 1; min-width: 140px;
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; font-size: 0.88rem; font-family: var(--sans);
    outline: none; transition: border-color 0.2s;
  }
  .input:focus { border-color: var(--accent); }
  select.input { cursor: pointer; }
  textarea.input { min-height: 76px; resize: vertical; font-family: var(--mono); font-size: 0.82rem; }

  .btn {
    border: 1px solid var(--line-strong); background: transparent; color: var(--text);
    border-radius: 9px; padding: 9px 16px; font-size: 0.85rem; cursor: pointer;
    transition: all 0.2s; font-family: var(--sans);
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.danger { border-color: rgba(239, 71, 111, 0.5); color: var(--danger); }
  .btn.danger:hover { background: rgba(239, 71, 111, 0.14); border-color: var(--danger); }
  .btn.sm { padding: 5px 11px; font-size: 0.78rem; }

  /* 列表 */
  ul.list { list-style: none; }
  ul.list li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px dashed rgba(120, 160, 255, 0.1);
    font-size: 0.9rem;
  }
  ul.list li:last-child { border-bottom: none; }
  ul.list li.done .t { text-decoration: line-through; color: var(--muted); }
  ul.list li .t { flex: 1; word-break: break-all; }
  ul.list li time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .chk { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }

  /* 表格 */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(120, 160, 255, 0.1); }
  table.tbl th { color: var(--muted); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.05em; }
  table.tbl td.num { font-family: var(--mono); }

  /* 像素画预览 */
  .px-wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .px-canvas {
    width: 256px; height: 256px;
    image-rendering: pixelated;
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: #070a14;
  }
  .px-meta { font-size: 0.82rem; color: var(--muted); line-height: 2; }

  /* 倒计时大数字 */
  .cd-big {
    font-family: var(--mono); font-size: 1.9rem; font-weight: 700; color: var(--text);
    letter-spacing: 0.03em; margin: 4px 0 2px;
  }
  .cd-big em { font-style: normal; color: var(--accent); }
  .cd-name { color: var(--muted); font-size: 0.88rem; margin-bottom: 12px; }

  /* 每日一句 */
  .q-card {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .q-card .qt { font-size: 1.02rem; line-height: 1.75; }
  .q-card .qa { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
  .q-label { font-size: 0.76rem; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 6px; }

  /* 网盘历史 */
  .pan-link { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); word-break: break-all; }
  .pan-plat { font-size: 0.8rem; color: var(--text); white-space: nowrap; }

  footer { color: var(--muted); font-size: 0.75rem; text-align: center; padding: 30px 0 10px; font-family: var(--mono); letter-spacing: 0.08em; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  #app { position: relative; z-index: 1; }
  #lock {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(61,123,255,0.16), transparent 60%), rgba(5,7,12,0.72);
    backdrop-filter: blur(6px);
  }
  #lock.hidden { display: none; }
  .lock-card {
    width: 100%; max-width: 380px;
    border: 1px solid var(--line-strong); border-radius: 16px;
    background: rgba(10,17,34,0.92);
    padding: 30px 28px 26px; text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  }
  .lock-logo {
    font-family: var(--mono); font-weight: 700; letter-spacing: 0.08em;
    font-size: 1.12rem; color: var(--text);
  }
  .lock-sub { color: var(--muted); font-size: 0.84rem; margin: 10px 0 22px; }
  #lock-pw {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 1rem; font-family: var(--mono);
    outline: none; text-align: center; letter-spacing: 0.12em;
  }
  #lock-pw:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #lock-pw:disabled { opacity: 0.55; }
  #lock-go {
    width: 100%; margin-top: 14px; cursor: pointer;
    border: none; border-radius: 10px; padding: 12px;
    background: var(--accent); color: #fff; font-size: 0.95rem; font-family: var(--sans);
    transition: filter 0.2s;
  }
  #lock-go:hover { filter: brightness(1.12); }
  #lock-go:disabled { opacity: 0.6; cursor: default; }
  #lock-err { color: var(--danger); font-size: 0.82rem; min-height: 1.1em; margin-top: 12px; }
  .lock-back { display: inline-block; margin-top: 10px; color: var(--muted); font-size: 0.8rem; text-decoration: none; }
  .lock-back:hover { color: var(--accent); }
  #lock.shake .lock-card { animation: lockshake 0.4s; }
  @keyframes lockshake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="app" hidden></div>

<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">ATOUOP_CONTROL</div>
    <div class="lock-sub">私人管理面板 · 请输入访问密码</div>
    <input id="lock-pw" type="password" placeholder="密码" autocomplete="off" inputmode="numeric">
    <button id="lock-go" type="button">进入控制台</button>
    <div id="lock-err"></div>
    <a class="lock-back" href="index.html">← 返回主页</a>
  </div>
</div>

<script>

(function () {
  var app = document.getElementById('app');
  var lock = document.getElementById('lock');
  var pw = document.getElementById('lock-pw');
  var go = document.getElementById('lock-go');
  var errBox = document.getElementById('lock-err');
  var subBox = document.querySelector('.lock-sub');
  var SESSION_KEY = 'atouop:ctrl:session';
  var PWSTORE_KEY = 'atouop:ctrl:pw';
  var FAIL_KEY = 'atouop:ctrl:fails';
  var LOCK_KEY = 'atouop:ctrl:lockuntil';
  var MAX_TRIES = 5;
  var COOLDOWN = 300000; // 5 分钟
  var cdTimer = null;

  function getFails() { return parseInt(localStorage.getItem(FAIL_KEY) || '0', 10) || 0; }
  function setFails(n) { localStorage.setItem(FAIL_KEY, String(n)); }
  function getLockUntil() { return parseInt(localStorage.getItem(LOCK_KEY) || '0', 10) || 0; }
  function setLockUntil(t) { if (t) localStorage.setItem(LOCK_KEY, String(t)); else localStorage.removeItem(LOCK_KEY); }
  function resetAttempts() { localStorage.removeItem(FAIL_KEY); setLockUntil(0); }
  function updateSub() {
    var f = getFails();
    subBox.textContent = f > 0 ? ('私人管理面板 · 还可尝试 ' + (MAX_TRIES - f) + ' 次') : '私人管理面板 · 请输入访问密码';
  }

  function b64ToBuf(b64) {
    var bin = atob(b64);
    var buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }
  async function deriveKey(password, salt) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
      { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(password) {
    var blob = JSON.parse(document.getElementById('enc').textContent);
    var salt = b64ToBuf(blob.s), iv = b64ToBuf(blob.i);
    var data = b64ToBuf(blob.d), tag = b64ToBuf(blob.t);
    var key = await deriveKey(password, salt);
    var ct = new Uint8Array(data.length + tag.length);
    ct.set(data, 0); ct.set(tag, data.length);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function mount(payload, password) {
    window.__ctrlPw = password || '';
    app.innerHTML = payload.html;
    app.hidden = false;
    var s = document.createElement('script');
    s.textContent = payload.js;
    document.body.appendChild(s);
    lock.classList.add('hidden');
  }
  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) { mount(JSON.parse(saved), sessionStorage.getItem(PWSTORE_KEY) || ''); return; }
  } catch (e) {}
  function showError(msg) {
    errBox.textContent = msg;
    lock.classList.remove('shake');
    void lock.offsetWidth;
    lock.classList.add('shake');
    pw.value = ''; pw.focus();
  }
  function tickLockout() {
    var remain = getLockUntil() - Date.now();
    if (remain <= 0) {
      clearInterval(cdTimer);
      resetAttempts();
      pw.disabled = false; go.disabled = false;
      errBox.textContent = '';
      updateSub();
      pw.focus();
      return;
    }
    var s = Math.ceil(remain / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    subBox.textContent = '访问已临时锁定';
    errBox.textContent = '5 次机会已用完，请 ' + m + ' 分 ' + (sec < 10 ? '0' : '') + sec + ' 秒后再试';
  }
  function enterLockout() {
    pw.disabled = true; go.disabled = true;
    pw.value = '';
    tickLockout();
    cdTimer = setInterval(tickLockout, 1000);
  }
  var busy = false;
  async function submit() {
    if (busy) return;
    if (getLockUntil() > Date.now()) return;
    var pwd = pw.value;
    if (!pwd) { showError('请输入密码'); return; }
    busy = true; go.disabled = true; go.textContent = '验证中…';
    try {
      var payload = await decrypt(pwd);
      resetAttempts();
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(payload));
        sessionStorage.setItem(PWSTORE_KEY, pwd);
      } catch (e) {}
      mount(payload, pwd);
    } catch (e) {
      busy = false; go.disabled = false; go.textContent = '进入控制台';
      var f = getFails() + 1;
      setFails(f);
      if (f >= MAX_TRIES) {
        setLockUntil(Date.now() + COOLDOWN);
        enterLockout();
      } else {
        showError('密码错误，还剩 ' + (MAX_TRIES - f) + ' 次机会');
        updateSub();
      }
    }
  }
  go.addEventListener('click', submit);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  if (getLockUntil() > Date.now()) {
    enterLockout();
  } else {
    if (getLockUntil() && getLockUntil() <= Date.now()) resetAttempts();
    updateSub();
    pw.focus();
  }
})();

</script>

        <input class="acx-input" id="acx-name" type="text" placeholder="新账号名" style="flex:1;min-width:140px;">
        <input class="acx-input" id="acx-token" type="text" placeholder="自定义 token（留空随机）" style="flex:1;min-width:150px;">
        <button class="acx-btn" id="acx-create" type="button">创建账号</button>
      </div>

      <div class="acx-list" id="acx-list"></div>
      <div class="acx-msg" id="acx-msg"></div>
      <div class="acx-hint">
        每个账号独立看待办/课表，互不干扰。第一个账号为站长（owner）。登录走登录页，桥接各自运行（用各自的桥接密钥）。
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var pw = '';
  var mask = document.getElementById('acx-mask');
  var msg = document.getElementById('acx-msg');
  document.getElementById('acx-fab').addEventListener('click', function () {
    mask.classList.add('open');
  });
  document.getElementById('acx-close').addEventListener('click', function () {
    mask.classList.remove('open');
  });
  function setMsg(t, color) {
    msg.textContent = t || '';
    msg.style.color = color || '#ff8a8a';
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function () {});
    } else {
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
  }
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      copyText(document.getElementById(b.getAttribute('data-copy')).textContent);
    });
  });

  function api(path, body) {
    var url = '/api/accounts?pw=' + encodeURIComponent(pw);
    var opt = { credentials: 'same-origin' };
    if (body) {
      opt.method = 'POST';
      opt.headers = { 'Content-Type': 'application/json' };
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    });
  }

  function fmtTime(t) {
    if (!t) return '从未';
    try { return new Date(t).toLocaleString('zh-CN', { hour12: false }); }
    catch (e) { return String(t); }
  }

  function render(accounts) {
    var box = document.getElementById('acx-list');
    box.innerHTML = '';
    accounts.forEach(function (a) {
      var card = document.createElement('div');
      card.className = 'acx-card';
      card.innerHTML =
        '<div class="nm">' + escapeHtml(a.name) +
        '<span class="acx-tag ' + (a.role === 'owner' ? 'owner' : 'member') + '">' +
        (a.role === 'owner' ? '站长' : '成员') + '</span>' +
        '<span class="acx-tag ' + (a.online ? 'on' : 'off') + '">' +
        (a.online ? '在线' : '离线') + '</span></div>' +
        '<div class="acx-meta">待办 ' + a.tasks + ' · 事件 ' + a.events + ' · 课程 ' + a.courses +
        ' · 创建 ' + fmtTime(a.created) + ' · 最近 ' + fmtTime(a.lastSeen) + '</div>';
      var ops = document.createElement('div');
      ops.className = 'acx-ops';
      ops.appendChild(btn('重置 Token', 'ghost', function () {
        if (!confirm('重置该账号的登录 Token？')) return;
        api('', { action: 'reset', name: a.name, kind: 'token' }).then(function (res) {
          if (res.ok) {
            showCred(res.d.token, null);
            load();
          } else setMsg(res.d.error);
        });
      }));
      ops.appendChild(btn('重置桥接密钥', 'ghost', function () {
        if (!confirm('重置该账号的桥接密钥？重置后旧 bridge 立即失效')) return;
        api('', { action: 'reset', name: a.name, kind: 'bridge' }).then(function (res) {
          if (res.ok) {
            showCred(null, res.d.bridge);
            load();
          } else setMsg(res.d.error);
        });
      }));
      ops.appendChild(btn('删除账号', 'danger', function () {
        if (!confirm('确定删除账号「' + a.name + '」？其数据将一并删除')) return;
        api('', { action: 'delete', name: a.name }).then(function (res) {
          if (res.ok) { setMsg('已删除', '#6ee7a8'); load(); }
          else setMsg(res.d.error);
        });
      }));
      card.appendChild(ops);
      box.appendChild(card);
    });
  }
  function btn(label, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'acx-btn ' + (cls || ''); b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showCred(token, bridge) {
    var c = document.getElementById('acx-newcred');
    c.style.display = 'block';
    if (token) document.getElementById('acx-vtoken').textContent = token;
    if (bridge) document.getElementById('acx-vbridge').textContent = bridge;
    if (token) document.getElementById('acx-vtoken').parentElement.style.display = '';
    else document.getElementById('acx-vtoken').parentElement.style.display = 'none';
    if (bridge) document.getElementById('acx-vbridge').parentElement.style.display = '';
    else document.getElementById('acx-vbridge').parentElement.style.display = 'none';
  }
  function load() {
    api().then(function (res) {
      if (res.ok) { render(res.d.accounts || []); setMsg(''); }
      else setMsg('密码错误或未授权');
    }).catch(function () { setMsg('网络错误'); });
  }
  document.getElementById('acx-unlock').addEventListener('click', function () {
    pw = document.getElementById('acx-pw').value;
    load();
  });
  document.getElementById('acx-pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { pw = e.target.value; load(); }
  });
  document.getElementById('acx-create').addEventListener('click', function () {
    var name = document.getElementById('acx-name').value.trim();
    var token = document.getElementById('acx-token').value.trim();
    if (!name) { setMsg('请填写账号名'); return; }
    api('', { action: 'create', name: name, token: token }).then(function (res) {
      if (res.ok) {
        showCred(res.d.token, res.d.bridge);
        document.getElementById('acx-name').value = '';
        document.getElementById('acx-token').value = '';
        setMsg('已创建：' + res.d.name + '（' + (res.d.role === 'owner' ? '站长' : '成员') + '）', '#6ee7a8');
        load();
      } else setMsg(res.d.error);
    });
  });
})();
</script>
<!-- ===== /账号管理组件 ===== -->

</body>
</html>
